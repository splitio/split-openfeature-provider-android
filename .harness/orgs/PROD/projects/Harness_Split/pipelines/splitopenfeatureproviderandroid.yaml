pipeline:
  name: split-openfeature-provider-android
  identifier: splitopenfeatureproviderandroid
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: split-openfeature-provider-android
        build: <+input>
  stages:
    - stage:
        name: Test
        identifier: Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Test
                  name: Setup Java and Run tests
                  identifier: Setup_Java_and_Run_tests
                  spec:
                    shell: Sh
                    command: |
                      # Install Java 17
                      apt-get update
                      apt-get install -y openjdk-17-jdk

                      # Set JAVA_HOME for this session
                      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                      export PATH=$JAVA_HOME/bin:$PATH

                      # Verify Java version
                      java -version

                      # Run tests
                      ./gradlew test
                    intelligenceMode: true
