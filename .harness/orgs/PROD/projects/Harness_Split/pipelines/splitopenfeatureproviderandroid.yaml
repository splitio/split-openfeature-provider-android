pipeline:
  name: split-openfeature-provider-android
  identifier: splitopenfeatureproviderandroid
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: githubdevops
        repoName: split-openfeature-provider-android
        build: <+input>
  stages:
    - stage:
        name: Test
        identifier: Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Setup Java 17
                  identifier: Setup_Java_17
                  spec:
                    shell: Sh
                    command: |
                      # Install Java 17
                      apt-get update
                      apt-get install -y openjdk-17-jdk

                      # Set JAVA_HOME
                      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                      echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> ~/.bashrc
                      echo "export PATH=\$JAVA_HOME/bin:\$PATH" >> ~/.bashrc

                      # Verify Java version
                      java -version
              - step:
                  type: Test
                  name: Run tests
                  identifier: Run_tests
                  spec:
                    shell: Sh
                    command: ./gradlew test
                    intelligenceMode: true
